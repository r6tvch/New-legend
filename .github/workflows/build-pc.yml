name: Build PC
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        shell: bash
        run: |
          echo "Files in repo:"; ls -la
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then echo "Unzipping: $Z"; unzip -o -q "$Z"; fi
          P=$(find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then echo "NO PROJECT FOUND - upload RogueWest-desktop.zip to the repo root"; exit 1; fi
          echo "PROJ=$(dirname "$P")" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install
        shell: bash
        run: cd "$PROJ" && npm install
      - name: Embed fonts
        shell: bash
        run: cd "$PROJ" && node prepare-fonts.js
      - name: Build
        shell: bash
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
        run: cd "$PROJ" && npx electron-builder --publish never
      - name: Collect
        shell: bash
        run: mkdir -p out && cp "$PROJ"/dist/*.exe "$PROJ"/dist/*.dmg "$PROJ"/dist/*.AppImage out/ 2>/dev/null || true; ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: RogueWest-${{ runner.os }}
          path: out/*
          if-no-files-found: warn
